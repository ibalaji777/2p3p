<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <!-- White Background -->
  <rect width="64" height="64" rx="14" fill="#ffffff"/>
  <rect width="62" height="62" x="1" y="1" rx="13" fill="none" stroke="#f1f5f9" stroke-width="1"/>
  
  <!-- Green 2D Blueprint Grid Base -->
  <polygon points="12,42 32,54 52,42 32,30" fill="none" stroke="#008844" stroke-width="1.8" stroke-dasharray="2,2"/>
  
  <!-- 3D Cube with Zoho Palette -->
  <!-- Top Face: Yellow #F9B200 -->
  <polygon points="32,10 49,20 32,30 15,20" fill="#F9B200" stroke="#E09E00" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- Left Face: Red #E42528 -->
  <polygon points="15,20 32,30 32,50 15,40" fill="#E42528" stroke="#C61B1E" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- Right Face: Blue #0073BC -->
  <polygon points="32,30 49,20 49,40 32,50" fill="#0073BC" stroke="#005B96" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- Center Ridge -->
  <line x1="32" y1="30" x2="32" y2="50" stroke="#FFFFFF" stroke-width="1.5"/>
</svg>
