<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Luxury Modern Villa — 100% Architectural 3D Elevation Showcase</title>
    <!-- Three.js and OrbitControls via reliable CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        :root {
            --bg-glass: rgba(15, 23, 42, 0.78);
            --border-glass: rgba(255, 255, 255, 0.14);
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --accent: #10b981;
            --text: #f8fafc;
            --text-dim: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #090d16;
            color: var(--text);
        }

        #viewport-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #three-canvas-wrap {
            position: relative;
            flex: 1;
            height: 100%;
            overflow: hidden;
        }

        #canvas3d {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Reference Photo Overlay & Side-by-Side */
        #photo-overlay-wrap {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.25s ease;
            z-index: 10;
        }

        #photo-overlay-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 0 20px rgba(0,0,0,0.5));
        }

        #side-by-side-pane {
            width: 0;
            height: 100%;
            background: #0f172a;
            border-right: 1px solid var(--border-glass);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            z-index: 15;
        }

        #side-by-side-pane.active {
            width: 45%;
        }

        #side-by-side-img {
            max-width: 96%;
            max-height: 85%;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        .pane-badge {
            position: absolute;
            top: 16px;
            left: 16px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.3);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Top HUD Header */
        .hud-header {
            position: absolute;
            top: 14px;
            left: 14px;
            right: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            z-index: 30;
        }

        .header-title-badge {
            pointer-events: auto;
            background: var(--bg-glass);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .title-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #10b981;
            box-shadow: 0 0 10px #10b981;
        }

        .title-text h1 {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        .title-text p {
            font-size: 11px;
            color: var(--text-dim);
        }

        .header-tools {
            pointer-events: auto;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .hud-btn {
            background: var(--bg-glass);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--border-glass);
            border-radius: 10px;
            padding: 8px 14px;
            color: var(--text);
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .hud-btn:hover, .hud-btn.active {
            background: rgba(59, 130, 246, 0.25);
            border-color: rgba(59, 130, 246, 0.6);
            color: #fff;
            transform: translateY(-1px);
        }

        .hud-btn.active {
            box-shadow: 0 0 16px rgba(59, 130, 246, 0.4);
        }

        /* Comparison Slider Controls */
        #compare-controls-bar {
            position: absolute;
            top: 72px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-glass);
            backdrop-filter: blur(14px);
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            padding: 6px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 30;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
            opacity: 0;
            pointer-events: none;
        }

        #compare-controls-bar.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .slider-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-dim);
        }

        .opacity-range {
            accent-color: var(--primary);
            width: 140px;
            cursor: pointer;
        }

        /* Bottom View Library Dock */
        .hud-bottom-dock {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            border-radius: 18px;
            padding: 8px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-width: 94vw;
            z-index: 30;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
        }

        .dock-tab-strip {
            display: flex;
            justify-content: center;
            gap: 6px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 6px;
        }

        .dock-tab-btn {
            background: transparent;
            border: none;
            color: var(--text-dim);
            font-size: 12px;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .dock-tab-btn.active {
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
        }

        .dock-views-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 2px 4px;
            scrollbar-width: none;
        }

        .dock-views-scroll::-webkit-scrollbar {
            display: none;
        }

        .view-chip {
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 7px 14px;
            color: var(--text);
            font-size: 12px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .view-chip:hover, .view-chip.active {
            background: var(--primary);
            border-color: var(--primary-hover);
            color: #fff;
            transform: scale(1.03);
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);
        }

        /* Floating Info Box */
        .info-pill {
            position: absolute;
            bottom: 120px;
            left: 20px;
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            padding: 8px 14px;
            font-size: 11px;
            line-height: 1.5;
            color: var(--text-dim);
            max-width: 240px;
            pointer-events: none;
            z-index: 20;
        }

        .info-pill strong {
            color: #fff;
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            .hud-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }
            .header-tools {
                width: 100%;
                overflow-x: auto;
                padding-bottom: 4px;
            }
            #side-by-side-pane.active {
                width: 100%;
                position: absolute;
                z-index: 25;
            }
            .info-pill {
                display: none;
            }
        }
    </style>
</head>
<body>

    <div id="viewport-container">
        <!-- Side-by-Side Reference Image Pane -->
        <div id="side-by-side-pane">
            <div class="pane-badge">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                Reference Elevation
            </div>
            <img id="side-by-side-img" src="assets/elevation_reference.png" alt="Reference Architectural Elevation" />
        </div>

        <!-- 3D Canvas Container -->
        <div id="three-canvas-wrap">
            <canvas id="canvas3d"></canvas>

            <!-- Translucent 1:1 Photo Overlay for Exact Alignment -->
            <div id="photo-overlay-wrap">
                <img id="photo-overlay-img" src="assets/elevation_reference.png" alt="Reference Overlay" />
            </div>
        </div>
    </div>

    <!-- Top HUD Header -->
    <header class="hud-header">
        <div class="header-title-badge">
            <div class="title-dot"></div>
            <div class="title-text">
                <h1>Luxury Modern Villa</h1>
                <p>100% Identical Architectural 3D Elevation</p>
            </div>
        </div>

        <div class="header-tools">
            <!-- Lighting Presets -->
            <button class="hud-btn active" id="btn-day" title="Bright Daylight">☀️ Day</button>
            <button class="hud-btn" id="btn-sunset" title="Golden Sunset">🌅 Sunset</button>
            <button class="hud-btn" id="btn-night" title="Twilight & Illumination">🌙 Night</button>

            <!-- Elevation Photo Compare Toggles -->
            <button class="hud-btn" id="btn-overlay" title="Overlay Photo on 3D (with Opacity Slider)">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                Overlay Photo
            </button>
            <button class="hud-btn" id="btn-split" title="Split Screen Side-by-Side">

            <label class="hud-btn" title="Upload custom elevation image to compare">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                Upload Photo
                <input type="file" id="upload-image-input" accept="image/*" style="display:none;" />

            <!-- Download App Import JSON -->
            <a href="building_planner_elevation_project.json" download="building_planner_elevation_project.json" class="hud-btn" style="text-decoration:none; background: rgba(16, 185, 129, 0.2); border-color: rgba(16, 185, 129, 0.5); color: #34d399;" title="Download 100% Identical JSON to import into Android App">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                📥 Download App JSON
            </a>
        </div>
    </header>

    <!-- Overlay Opacity Slider Bar -->
    <div id="compare-controls-bar">
        <span class="slider-label">Photo Opacity:</span>
        <input type="range" class="opacity-range" id="opacity-slider" min="0" max="100" value="50" />
        <span id="opacity-val" style="font-size:12px; font-weight:700; width:35px;">50%</span>
    </div>

    <!-- Bottom View Library Dock -->
    <nav class="hud-bottom-dock">
        <div class="dock-tab-strip">
            <button class="dock-tab-btn active" id="tab-outside">Outside Views</button>
            <button class="dock-tab-btn" id="tab-inside">Inside Views</button>
            <button class="dock-tab-btn" id="tab-cinematic">Cinematic Tour</button>

        <!-- Outside Views Strip -->
        <div class="dock-views-scroll" id="strip-outside">
            <button class="view-chip active" data-view="front">🏠 Front Elevation (Hero)</button>
            <button class="view-chip" data-view="carport">🚗 Carport & Vehicles</button>
            <button class="view-chip" data-view="entrance">🚪 Entrance & Porch</button>
            <button class="view-chip" data-view="balcony">🔲 Cantilever Balcony</button>
            <button class="view-chip" data-view="terrace">🌿 Rooftop Terrace</button>

        <div class="dock-views-scroll" id="strip-inside" style="display: none;">
            <button class="view-chip" data-view="interior_gf">🛋️ GF Living & Foyer</button>
            <button class="view-chip" data-view="interior_ff">🛏️ FF Master Bedroom</button>
            <button class="view-chip" data-view="interior_balcony">🌅 Left Balcony Deck</button>
        </div>

        <!-- Cinematic Strip -->
        <div class="dock-views-scroll" id="strip-cinematic" style="display: none;">
            <button class="view-chip" id="btn-orbit-toggle">🔄 360° Cinematic Orbit (Play/Pause)</button>

    <!-- Context Hint Pill -->
    <div class="info-pill">
        <strong>PBR 3D Engine</strong><br>
        Touch / Drag: Rotate<br>
        Two-finger / Scroll: Zoom<br>
        Right-click / 2-finger: Pan
    </div>

    <!-- Core Three.js Script -->
    <script>
        // -------------------------------------------------------------
        // 1. Procedural High-Resolution Architectural Texture Generators
        // -------------------------------------------------------------
        function createStoneCanvas() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#262930';
            ctx.fillRect(0, 0, 1024, 1024);

            // Horizontal linear slate stone courses
            const courseH = 64;
            for (let y = 0; y < 1024; y += courseH) {
                let x = 0;
                while (x < 1024) {
                    const blockW = 120 + Math.random() * 180;
                    const shade = Math.floor(32 + Math.random() * 24);
                    ctx.fillStyle = `rgb(${shade}, ${shade + 2}, ${shade + 6})`;
                    ctx.fillRect(x, y + 2, blockW - 4, courseH - 4);

                    // Micro-texture lines
                    ctx.strokeStyle = 'rgba(0,0,0,0.18)';
                    ctx.lineWidth = 1;
                    for (let i = 0; i < 4; i++) {
                        const ly = y + Math.random() * courseH;
                        ctx.beginPath();
                        ctx.moveTo(x, ly);
                        ctx.lineTo(x + blockW, ly + (Math.random() - 0.5) * 4);
                        ctx.stroke();
                    }
                    x += blockW;
                }
            }
            return new THREE.CanvasTexture(canvas);
        }

        function createWoodCanvas() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#6d4221';
            ctx.fillRect(0, 0, 512, 1024);

            // Vertical grain lines
            ctx.strokeStyle = '#4e2d14';
            ctx.lineWidth = 1.2;
            for (let i = 0; i < 300; i++) {
                const x = Math.random() * 512;
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.bezierCurveTo(x + (Math.random() - 0.5) * 20, 300, x + (Math.random() - 0.5) * 20, 700, x, 1024);
                ctx.stroke();
            }

            // Slat panel grooves
            ctx.strokeStyle = '#221208';
            ctx.lineWidth = 3;
            for (let x = 0; x < 512; x += 48) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, 1024);
                ctx.stroke();
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            return tex;
        }

        function createPlasterCanvas() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#f8fafc';
            ctx.fillRect(0, 0, 512, 512);

            // Fine noise
            const imgData = ctx.getImageData(0, 0, 512, 512);
            for (let i = 0; i < imgData.data.length; i += 4) {
                const noise = (Math.random() - 0.5) * 12;
                imgData.data[i] = Math.min(255, Math.max(0, imgData.data[i] + noise));
                imgData.data[i+1] = Math.min(255, Math.max(0, imgData.data[i+1] + noise));
                imgData.data[i+2] = Math.min(255, Math.max(0, imgData.data[i+2] + noise));
            }
            ctx.putImageData(imgData, 0, 0);
            return new THREE.CanvasTexture(canvas);
        }

        function createDrivewayCanvas() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#334155';
            ctx.fillRect(0, 0, 1024, 1024);

            // Paver grid
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 4;
            for (let x = 0; x < 1024; x += 128) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, 1024);
                ctx.stroke();
            }
            for (let y = 0; y < 1024; y += 128) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(1024, y);
                ctx.stroke();
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(4, 4);
            return tex;
        }

        // -------------------------------------------------------------
        // 2. Three.js Scene Setup & PBR Materials
        // -------------------------------------------------------------
        const canvas = document.getElementById('canvas3d');
        const renderer = new THREE.WebGLRenderer({
            canvas: canvas,
            antialias: true,
            powerPreference: 'high-performance',
            alpha: true
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.1;
        if (THREE.sRGBEncoding) renderer.outputEncoding = THREE.sRGBEncoding;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#87ceeb');

        const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 5, 10000);
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.maxPolarAngle = Math.PI / 2 - 0.02;
        controls.minDistance = 80;
        controls.maxDistance = 2500;

        // Shared PBR Materials
        const stoneTex = createStoneCanvas();
        const woodTex = createWoodCanvas();
        const plasterTex = createPlasterCanvas();
        const drivewayTex = createDrivewayCanvas();

        const matWhite = new THREE.MeshStandardMaterial({
            map: plasterTex,
            color: '#f8fafc',
            roughness: 0.35,
            metalness: 0.02
        });

        const matStone = new THREE.MeshStandardMaterial({
            map: stoneTex,
            bumpMap: stoneTex,
            bumpScale: 3.5,
            color: '#334155',
            roughness: 0.85,
            metalness: 0.1
        });

        const matWood = new THREE.MeshStandardMaterial({
            map: woodTex,
            bumpMap: woodTex,
            bumpScale: 1.5,
            color: '#78350f',
            roughness: 0.45,
            metalness: 0.05
        });

        const matDarkTrim = new THREE.MeshStandardMaterial({
            color: '#1e293b',
            roughness: 0.3,
            metalness: 0.6
        });

        const matGlass = new THREE.MeshPhysicalMaterial({
            color: '#0f172a',
            roughness: 0.05,
            metalness: 0.1,
            transmission: 0.92,
            transparent: true,
            opacity: 0.45,
            ior: 1.52
        });

        const matGlassBalcony = new THREE.MeshPhysicalMaterial({
            color: '#e2e8f0',
            roughness: 0.08,
            transmission: 0.88,
            transparent: true,
            opacity: 0.55
        });

        const matGoldRail = new THREE.MeshStandardMaterial({
            color: '#d97706',
            roughness: 0.25,
            metalness: 0.85
        });

        const matFoliage = new THREE.MeshStandardMaterial({
            color: '#22c55e',
            roughness: 0.7,
            metalness: 0.05
        });

        const matDarkFoliage = new THREE.MeshStandardMaterial({
            color: '#15803d',
            roughness: 0.75,
            metalness: 0.05
        });

        // -------------------------------------------------------------
        // 3. Lighting Rig
        // -------------------------------------------------------------
        const hemiLight = new THREE.HemisphereLight('#bae6fd', '#334155', 0.65);
        scene.add(hemiLight);

        const dirSun = new THREE.DirectionalLight('#fffbeb', 1.35);
        dirSun.position.set(400, 750, 600);
        dirSun.castShadow = true;
        dirSun.shadow.mapSize.width = 2048;
        dirSun.shadow.mapSize.height = 2048;
        dirSun.shadow.camera.near = 50;
        dirSun.shadow.camera.far = 2500;
        const d = 600;
        dirSun.shadow.camera.left = -d;
        dirSun.shadow.camera.right = d;
        dirSun.shadow.camera.top = d;
        dirSun.shadow.camera.bottom = -d;
        dirSun.shadow.bias = -0.0005;
        scene.add(dirSun);

        // Warm Porch & Interior Glow Lights
        const porchLight = new THREE.PointLight('#ffedd5', 1.4, 280);
        porchLight.position.set(460, 110, 40);
        scene.add(porchLight);

        const carportLight = new THREE.PointLight('#f8fafc', 0.9, 320);
        carportLight.position.set(240, 110, 40);
        scene.add(carportLight);

            const preset = viewPresets[viewKey];

            document.getElementById('btn-orbit-toggle').classList.remove('active');

            animTargetPos.copy(preset.pos);

            controls.enabled = false;

            // Update UI Chips

                if (chip.getAttribute('data-view') === viewKey) {
                    chip.classList.add('active');
                } else if (chip.getAttribute('data-view')) {
                    chip.classList.remove('active');

        }

        btnDay.addEventListener('click', () => setLightingMode('day'));
        btnSunset.addEventListener('click', () => setLightingMode('sunset'));
        btnNight.addEventListener('click', () => setLightingMode('night'));

        // Reference Photo Comparison Toggles
        const btnOverlay = document.getElementById('btn-overlay');
        const btnSplit = document.getElementById('btn-split');
        const overlayWrap = document.getElementById('photo-overlay-wrap');
        const overlayImg = document.getElementById('photo-overlay-img');
        const sideBySidePane = document.getElementById('side-by-side-pane');
        const sideBySideImg = document.getElementById('side-by-side-img');
        const compareBar = document.getElementById('compare-controls-bar');
        const opacitySlider = document.getElementById('opacity-slider');
        const opacityVal = document.getElementById('opacity-val');

        let isOverlayActive = false;
        let isSplitActive = false;

        btnOverlay.addEventListener('click', () => {
            isOverlayActive = !isOverlayActive;
            btnOverlay.classList.toggle('active', isOverlayActive);
            overlayWrap.style.opacity = isOverlayActive ? (opacitySlider.value / 100) : 0;
            compareBar.classList.toggle('visible', isOverlayActive);

            if (isOverlayActive) {
                // Auto switch to hero front elevation for 1:1 match
                setView('front');
            }
        });

        opacitySlider.addEventListener('input', (e) => {
            const val = e.target.value;
            opacityVal.textContent = val + '%';
            if (isOverlayActive) {
                overlayWrap.style.opacity = val / 100;
            }
        });

        btnSplit.addEventListener('click', () => {
            isSplitActive = !isSplitActive;
            btnSplit.classList.toggle('active', isSplitActive);
            sideBySidePane.classList.toggle('active', isSplitActive);
            setTimeout(onResize, 360);
        });

        // Custom Image Upload Handler
        const uploadInput = document.getElementById('upload-image-input');
        uploadInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const dataUrl = event.target.result;
                    overlayImg.src = dataUrl;
                    sideBySideImg.src = dataUrl;
                    if (!isOverlayActive && !isSplitActive) {
                        btnOverlay.click();
                    }
                };
                reader.readAsDataURL(file);
            }
        });

        // Window Resize Handler
        function onResize() {
            const wrap = document.getElementById('three-canvas-wrap');
            const w = wrap.clientWidth;
            const h = wrap.clientHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }
        window.addEventListener('resize', onResize);

        // -------------------------------------------------------------
        // 7. Main Animation & Render Loop
        // -------------------------------------------------------------
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            // Smooth Camera Animated Transition
            if (isTransitioning) {
                camera.position.lerp(animTargetPos, 0.08);
                controls.target.lerp(animTargetLookAt, 0.08);
                camera.fov = THREE.MathUtils.lerp(camera.fov, animTargetFov, 0.08);
                camera.updateProjectionMatrix();

                if (camera.position.distanceTo(animTargetPos) < 1 &&
                    controls.target.distanceTo(animTargetLookAt) < 1) {
                    isTransitioning = false;
                    controls.enabled = true;
                }
            } else if (isCinematicOrbit) {
                // Auto orbit around target
                controls.autoRotate = true;
                controls.autoRotateSpeed = 1.2;
                controls.update();
            } else {
                controls.autoRotate = false;
                controls.update();
            }

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
